name: AgentWatch CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── Security Audit ─────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/backend/package-lock.json

      - name: Audit backend dependencies
        working-directory: packages/backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: packages/frontend
        run: npm audit --audit-level=high

  # ── Backend: Lint, Type-check, Test ───────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: security-audit

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agentwatch_test
          POSTGRES_USER: agentwatch_test
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install dependencies
        working-directory: packages/backend
        run: npm ci

      - name: TypeScript type check
        working-directory: packages/backend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: packages/backend
        run: npm run lint

      - name: Run tests
        working-directory: packages/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://agentwatch_test:test_password_ci@localhost:5432/agentwatch_test
          JWT_ACCESS_SECRET: test_access_secret_must_be_at_least_64_chars_long_for_validation
          JWT_REFRESH_SECRET: test_refresh_secret_must_be_at_least_64_chars_long_for_test
          DEVICE_JWT_SECRET: test_device_secret_must_be_at_least_64_chars_long_for_test
          TURN_SECRET: test_turn_secret_at_least_32_chars
          TURN_SERVER_URLS: turn:localhost:3478
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: packages/backend/coverage

  # ── Frontend: Lint, Type-check, Build ─────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: packages/frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: packages/frontend
        run: npm run lint

      - name: Build (validates no build errors)
        working-directory: packages/frontend
        env:
          VITE_API_URL: http://localhost:4000
          VITE_WS_URL: ws://localhost:4000
        run: npm run build

  # ── Secret Scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
