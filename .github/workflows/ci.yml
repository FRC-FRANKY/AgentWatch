name: AgentWatch CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ── Security Audit ─────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

  # ── Backend: Lint, Type-check, Test ───────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm exec --workspace=@agentwatch/backend -- tsc --noEmit

      - name: ESLint
        run: npm run lint --workspace=@agentwatch/backend

      - name: Build backend
        run: npm run build --workspace=@agentwatch/backend

      - name: Run tests
        env:
          NODE_ENV: test
          USE_DEMO_MODE: 'true'
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/agentwatch_test
          JWT_ACCESS_SECRET: test_access_secret_for_ci_only_64_chars_minimum_validation_0000000000000000
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_only_64_chars_minimum_validation_0000000000000000
          JWT_PARTIAL_SECRET: test_partial_secret_for_ci_only_64_chars_minimum_validation_0000000000000000
          DEVICE_JWT_SECRET: test_device_secret_for_ci_only_64_chars_minimum_validation_0000000000000000
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TURN_SECRET: test_turn_secret_for_ci_only_64_chars_minimum_validation_0000000000000000
          TURN_SERVER_URLS: turn:localhost:3478
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
        run: npm test --workspace=@agentwatch/backend

      - name: Upload coverage
        if: success() && hashFiles('packages/backend/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          directory: packages/backend/coverage

  # ── Frontend: Lint, Type-check, Build ─────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check --workspace=@agentwatch/frontend

      - name: ESLint
        run: npm run lint --workspace=@agentwatch/frontend

      - name: Build (validates no build errors)
        env:
          VITE_API_URL: http://localhost:4000/api
          VITE_WS_URL: ws://localhost:4000/ws/signal
        run: npm run build --workspace=@agentwatch/frontend

  # ── Secret Scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unverified,unknown
