<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentWatch Symbol">
  <defs>
    <linearGradient id="awA_color" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="45%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>
    <linearGradient id="awOrbit_color" x1="10" y1="70" x2="90" y2="35" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="35%" stop-color="#38BDF8"/>
        <stop offset="65%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>
  </defs>

  <!-- Back Orbit Arc (sweeps behind right leg) -->
  <path d="M 44 41 C 58 35, 78 32, 88 36 C 96 40, 94 48, 83 55 C 76 59, 68 62, 59 64" 
        stroke="url(#awOrbit_color)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Letter 'A' Structure -->
  <path d="M 50 14 
           C 54 14, 57 16, 59 20 
           L 83 75 
           C 85 79, 83 84, 78 84 
           L 66 84 
           C 62 84, 59 81, 58 77 
           L 54 62 
           L 46 62 
           L 42 77 
           C 41 81, 38 84, 34 84 
           L 22 84 
           C 17 84, 15 79, 17 75 
           L 41 20 
           C 43 16, 46 14, 50 14 Z
           M 50 33
           C 47 33, 45 35, 44 38
           L 40 52
           L 60 52
           L 56 38
           C 55 35, 53 33, 50 33 Z"
        fill="url(#awA_color)" />

  <!-- Eye in Counter Space -->
  <path d="M 37 46.5 C 41 40, 59 40, 63 46.5 C 59 53, 41 53, 37 46.5 Z" fill="#FFFFFF" />
  <circle cx="50" cy="46.5" r="4.2" fill="#0F172A" />
  <circle cx="51.5" cy="45" r="1.3" fill="#FFFFFF" />

  <!-- Front Orbit Arc (sweeps across front of left leg) -->
