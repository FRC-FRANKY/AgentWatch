<svg viewBox="0 0 320 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentWatch Logo">
  <defs>
    <linearGradient id="awA_h" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="awOrbit_h" x1="10" y1="70" x2="90" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="awWatchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Symbol scaled and translated -->
  <g transform="translate(0, 5) scale(0.4)">
