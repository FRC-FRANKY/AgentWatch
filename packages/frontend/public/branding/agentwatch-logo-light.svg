    <path d="M 44 41 C 58 35, 78 32, 88 36 C 96 40, 94 48, 83 55 C 76 59, 68 62, 59 64" 
          stroke="url(#awOrbit_h)" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Letter A -->
    <path d="M 50 14 C 54 14, 57 16, 59 20 L 83 75 C 85 79, 83 84, 78 84 L 66 84 C 62 84, 59 81, 58 77 L 54 62 L 46 62 L 42 77 C 41 81, 38 84, 34 84 L 22 84 C 17 84, 15 79, 17 75 L 41 20 C 43 16, 46 14, 50 14 Z M 50 33 C 47 33, 45 35, 44 38 L 40 52 L 60 52 L 56 38 C 55 35, 53 33, 50 33 Z"
          fill="url(#awA_h)" />
    <!-- Eye -->
    <path d="M 37 46.5 C 41 40, 59 40, 63 46.5 C 59 53, 41 53, 37 46.5 Z" fill="#FFFFFF" />
    <circle cx="50" cy="46.5" r="4.2" fill="#0F172A" />
    <circle cx="51.5" cy="45" r="1.3" fill="#FFFFFF" />
    <!-- Front Orbit -->
    <path d="M 59 64 C 47 66, 33 66, 20 63 C 11 60, 6 65, 8 70 C 10 74, 18 75, 27 73 C 36 71, 46 67, 54 64" 
