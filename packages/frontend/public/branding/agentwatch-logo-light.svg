  <!-- Wordmark: AgentWatch -->
  <text x="48" y="31" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">
    <tspan fill="#0F172A">Agent</tspan><tspan fill="url(#awWatchGrad)">Watch</tspan>
  </text>

  
  <!-- Tagline -->
  <text x="49" y="45" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.28em" fill="#64748B" text-transform="uppercase">
